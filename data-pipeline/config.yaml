# ============================================================================
# Drought Intelligence Explorer — data pipeline configuration
# ----------------------------------------------------------------------------
# All paths are resolved relative to THIS file's directory unless absolute.
# `..` therefore means the repository root that contains index.html and data/.
# Every value used by the scientific steps is set here — no hidden constants.
# ============================================================================

region:
  name: India
  # [west, south, east, north] — bounding box used to clip every raster.
  # Slightly padded beyond the national extent so coastal pixels are kept.
  bbox: [66.0, 5.0, 99.5, 38.0]

# ---------------------------------------------------------------------------
# Archive window. `history` is everything downloaded/kept on disk and used for
# climatology fitting. `end: null` means "latest month present on disk".
# ---------------------------------------------------------------------------
history:
  start: "1981-01"          # CHIRPS v3 archive begins 1981-01
  end: null

# Climatology (base) periods used to fit distributions / normals.
#   null as second element = open-ended (through the latest month).
base_period:
  spi_spei: [1981, 2020]    # WMO-style 30-year reference for SPI/SPEI
  sma: [1981, 2020]         # soil-moisture normals
  vci: [2000, null]         # MODIS NDVI min/max (full record since 2000)

# Minimum number of base-period years required to fit a distribution.
# 20 is the hard floor (the step refuses to fit below it); 30 recommended.
min_base_years: 20

# What is written into the application's data/ folder.
export:
  period_start: "1981-01"   # first month in the app CSVs. SPI/SPEI/SMA cover
                            # the full CHIRPS/ERA5 archive; VCI is limited to
                            # the MODIS NDVI record (2000-02+) and the export
                            # records that per-indicator availability.
  period_end: null          # null = latest month available

# ---------------------------------------------------------------------------
# Paths. app_root points at the repository that contains index.html.
# ---------------------------------------------------------------------------
paths:
  app_root: ".."
  raw: "data_raw"               # downloads land here (never committed)
  processed: "data_processed"   # clipped rasters, series, indicators
  # null -> <app_root>/data/boundaries/india_districts.geojson
  boundaries: null
  # null -> <app_root>/data/districts.csv (and states.csv alongside)
  registry: null

# ---------------------------------------------------------------------------
# Sources. Verified 2026-10-31.
# ---------------------------------------------------------------------------
downloads:
  chirps:
    # CHIRPS v3.0 final monthly global GeoTIFF (CC BY 4.0 / public domain).
    # ~23 MB per month; final product appears ~3rd week of the following month.
    url_template: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/tifs/chirps-v3.0.{Y}.{M:02d}.tif"
    dir: "chirps"
    timeout_s: 300
    retries: 4
  era5land:
    # Copernicus CDS — ERA5-Land monthly means (free account + API key).
    dataset: "reanalysis-era5-land-monthly-means"
    product_type: "monthly_averaged_reanalysis"
    variables:
      - "potential_evaporation"        # m/day mean, negative by convention
      - "volumetric_soil_water_layer_1"  # 0-7 cm, m3/m3
      - "volumetric_soil_water_layer_2"  # 7-28 cm
      - "volumetric_soil_water_layer_3"  # 28-100 cm
    dir: "era5land"
    # Requests are split per year automatically. 1981+ aligns with CHIRPS;
    # the archive extends back to 1950 if you want a longer SPEI record.
  modis:
    # MODIS/Terra MOD13A3 v061 monthly NDVI (1 km, sinusoidal tiles).
    # Distributed from the NASA Earthdata Cloud (LP DAAC) since the legacy
    # e4ftl01.cr.usgs.gov archive was retired; download_modis_ndvi.py
    # reaches it through CMR + the `earthaccess` library.
    # Direct file locations look like:
    #   https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/MOD13A3.061/<granule>/<granule>.hdf
    product: "MOD13A3.061"
    dir: "modis"
    # 17 tiles cover the India bbox (computed from the sinusoidal grid —
    # regenerate for another region with:
    #   python -m die_pipeline.download_modis_ndvi --compute-tiles)
    tiles: ["h23v05", "h23v06", "h24v05", "h24v06", "h24v07", "h24v08",
            "h25v05", "h25v06", "h25v07", "h25v08", "h26v05", "h26v06",
            "h26v07", "h26v08", "h27v06", "h27v07", "h27v08"]
  appeears:
    # Alternative NDVI route: drop AppEEARS GeoTIFF exports (EPSG:4326)
    # here; prepare_rasters picks them up automatically by date in filename.
    dir: "appeears"

# ---------------------------------------------------------------------------
# Physical variables after prepare_rasters (units, guards).
# ---------------------------------------------------------------------------
variables:
  precip: {dir: "precip", units: "mm/month",  valid_range: [0.0, 4000.0]}
  # ERA5-Land potential evaporation can exceed 700 mm/month in the humid
  # north-east; the old 700 cap masked whole Mizoram months to NaN.
  pet:    {dir: "pet",    units: "mm/month",  valid_range: [0.0, 1500.0]}
  soil:   {dir: "soil",   units: "% volumetric", valid_range: [0.0, 60.0]}
  ndvi:   {dir: "ndvi",   units: "fraction", valid_range: [-0.2, 1.0]}

# ---------------------------------------------------------------------------
# District aggregation.
# ---------------------------------------------------------------------------
zonal:
  area_weighted: true        # weight pixels by cos(latitude) on lat/lon grids
  all_touched_fallback: true # re-rasterise districts smaller than one pixel

# ---------------------------------------------------------------------------
# Indicators to compute (ids must match metadata.json indicators[]).
# kind: spi | spei | sma | vci ; scale = accumulation months (spi/spei only)
# ---------------------------------------------------------------------------
indicators:
  - {id: "spi_1",   kind: spi,  scale: 1}
  - {id: "spi_3",   kind: spi,  scale: 3}
  - {id: "spi_6",   kind: spi,  scale: 6}
  - {id: "spi_12",  kind: spi,  scale: 12}
  - {id: "spei_1",  kind: spei, scale: 1}
  - {id: "spei_3",  kind: spei, scale: 3}
  - {id: "spei_6",  kind: spei, scale: 6}
  - {id: "spei_12", kind: spei, scale: 12}
  - {id: "sma",     kind: sma,  statistic: "percent_mean"}   # or "zscore"
  - {id: "vci",     kind: vci}

# ---------------------------------------------------------------------------
# metadata.json overrides applied by export_app.
# sources[] is written verbatim into metadata.json (access_date auto-filled).
# ---------------------------------------------------------------------------
app_metadata:
  data_mode: "static-research"
  # 1.0.2: state-statistics summaries are area-weighted (audit F3 fix).
  methodology_version: "research-gee-1.0.2"
  data_provenance: >-
    Research dataset extracted with Google Earth Engine (GEE): CHIRPS daily
    precipitation (v2.0 Final), ERA5-Land monthly potential evaporation and
    0-100 cm volumetric soil water (layers 1-3), and MODIS MOD13A3.061
    monthly NDVI. GEE performed monthly compositing and area-weighted
    district aggregation using ee.Image.pixelArea; SPI/SPEI/SMA/VCI were
    computed by the repository's reference Python step with a 1981-2020
    base period. SPI/SPEI/SMA cover 1981-01 onward; VCI starts at the first
    MODIS month (2000-02). See data/pipeline_manifest.json for run
    parameters and checksums.
  disclaimer: >-
    Research build: values are derived from the cited public datasets and
    gridded sources, aggregated to administrative districts. They are
    model/reanalysis-based estimates, not official drought declarations,
    and must not be used as the sole basis for operational decisions.
  sources:
    - id: "chirps-gee"
      name: "CHIRPS daily precipitation v2.0 Final (Funk et al., 2015) via Google Earth Engine"
      role: "rainfall input for SPI and SPEI"
      description: "Climate Hazards Center Infrared Precipitation with Stations, daily 0.05 degree, 1981-present, accessed through the Earth Engine catalog asset UCSB-CHG/CHIRPS/DAILY. GEE currently distributes the v2.0 Final product; the local download route uses v3.0. Public domain."
      url: "https://developers.google.com/earth-engine/datasets/catalog/UCSB-CHG_CHIRPS_DAILY"
    - id: "era5-land-gee"
      name: "ERA5-Land monthly aggregates (Munoz-Sabater et al., 2021) via Google Earth Engine"
      role: "potential evapotranspiration (SPEI) and soil moisture (SMA)"
      description: "ECMWF ERA5-Land monthly aggregated reanalysis, 0.1 degree, 1950-present, Earth Engine asset ECMWF/ERA5_LAND/MONTHLY_AGGR. Potential evaporation is the monthly accumulated depth; soil moisture is the mean of volumetric layers 1-3 (0-100 cm). Copernicus licence (attribution)."
      url: "https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_MONTHLY_AGGR"
    - id: "modis-ndvi-gee"
      name: "MODIS/Terra MOD13A3 v061 monthly NDVI (Didan, 2015) via Google Earth Engine"
      role: "NDVI input for the Vegetation Condition Index"
      description: "MODIS Terra monthly vegetation indices at 1 km, 2000-present, Earth Engine asset MODIS/061/MOD13A3, NDVI scaled by 0.0001. NASA LP DAAC open data."
      url: "https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MOD13A3"
    - id: "boundaries"
      name: "India administrative boundaries (districts, 2011-census demarcation)"
      role: "zonal aggregation units"
      description: "Community-maintained district GeoJSON, generalised for web use; 724 districts, 36 states/UTs. Not authoritative for legal boundary determination."
      url: "https://github.com/udit-001/india-maps-data"

# ---------------------------------------------------------------------------
# Google Earth Engine route (optional). Replaces steps 1-3 only:
#   download -> prepare_rasters -> zonal_stats
# GEE writes the same data_processed/series/*.csv files; steps 4-6
# (indicators, export, validate) are unchanged. Run:
#   python run.py gee --project <google-cloud-project> --end 2025-12
# See docs/gee-update-guide.md.
# ---------------------------------------------------------------------------
gee:
  project: null              # Google Cloud project with Earth Engine enabled
                             # (or pass --project / set EE_PROJECT)
  end: "2025-12"             # historical cut-off for the GEE build
  export_start: "1981-01"    # first month written to data/drought/*.csv.
                             # SPI/SPEI/SMA cover 1981+; VCI starts with MODIS
                             # (2000-02) and is labelled with its own window.
  chunk_months: 12           # months per reduceRegions request (split on timeout)
  tile_scale: 4              # raise to 8 if GEE reports memory errors
  boundary_asset: null       # optional projects/<project>/assets/india_districts_724
  upload_boundary: false     # create boundary_asset from the local GeoJSON first
  # Buffer (metres) applied only to districts whose total pixel count is 0,
  # i.e. the all_touched fallback for Mahe, Lakshadweep, Diu, etc.
  buffer_m:
    precip: 6000
    pet: 16000
    soil: 16000
    ndvi: 2000

  # Dataset mapping. Override any key here without touching Python.
  datasets:
    precip:
      id: "UCSB-CHG/CHIRPS/DAILY"   # GEE currently serves CHIRPS v2.0 Final
      band: "precipitation"
      monthly: "sum"                # daily mm/day -> monthly mm
    pet:
      id: "ECMWF/ERA5_LAND/MONTHLY_AGGR"
      band: "potential_evaporation_sum"
      monthly: "first"
      abs: true
      scale: 1000.0                 # m/month -> mm/month
    soil:
      id: "ECMWF/ERA5_LAND/MONTHLY_AGGR"
      bands: ["volumetric_soil_water_layer_1",
              "volumetric_soil_water_layer_2",
              "volumetric_soil_water_layer_3"]
      monthly: "first"
      scale: 100.0                  # m3/m3 -> % volumetric
    ndvi:
      id: "MODIS/061/MOD13A3"
      band: "NDVI"
      monthly: "first"
      mosaic: true                 # MOD13A3 ships as ~16-17 sinusoidal tiles
                                    # per month; mosaic composites them into one
                                    # image (col.first() would rasterise a single
                                    # tile and mask the rest of India)
      scale: 0.0001
      start: "2000-02"              # first MOD13A3 month

  # Provenance written into data/metadata.json when the GEE route is used.
  app_metadata:
    data_mode: "static-research"
    methodology_version: "research-gee-1.0.2"
    data_provenance: >-
      Research dataset extracted with Google Earth Engine (GEE): CHIRPS daily
      precipitation (v2.0 Final), ERA5-Land monthly potential evaporation and
      0-100 cm volumetric soil water (layers 1-3), and MODIS MOD13A3.061
      monthly NDVI. GEE performed monthly compositing and area-weighted
      district aggregation using ee.Image.pixelArea; SPI/SPEI/SMA/VCI were
      computed by the repository's reference Python step with a 1981-2020
      base period. See data/pipeline_manifest.json for run parameters and
      checksums.
    sources:
      - id: "chirps-gee"
        name: "CHIRPS daily precipitation v2.0 Final (Funk et al., 2015) via Google Earth Engine"
        role: "rainfall input for SPI and SPEI"
        description: "Climate Hazards Center Infrared Precipitation with Stations, daily 0.05 degree, 1981-present, accessed through the Earth Engine catalog asset UCSB-CHG/CHIRPS/DAILY. GEE currently distributes the v2.0 Final product; the local download route uses v3.0. Public domain."
        url: "https://developers.google.com/earth-engine/datasets/catalog/UCSB-CHG_CHIRPS_DAILY"
      - id: "era5-land-gee"
        name: "ERA5-Land monthly aggregates (Munoz-Sabater et al., 2021) via Google Earth Engine"
        role: "potential evapotranspiration (SPEI) and soil moisture (SMA)"
        description: "ECMWF ERA5-Land monthly aggregated reanalysis, 0.1 degree, 1950-present, Earth Engine asset ECMWF/ERA5_LAND/MONTHLY_AGGR. Potential evaporation is the monthly accumulated depth; soil moisture is the mean of volumetric layers 1-3 (0-100 cm). Copernicus licence (attribution)."
        url: "https://developers.google.com/earth-engine/datasets/catalog/ECMWF_ERA5_LAND_MONTHLY_AGGR"
      - id: "modis-ndvi-gee"
        name: "MODIS/Terra MOD13A3 v061 monthly NDVI (Didan, 2015) via Google Earth Engine"
        role: "NDVI input for the Vegetation Condition Index"
        description: "MODIS Terra monthly vegetation indices at 1 km, 2000-present, Earth Engine asset MODIS/061/MOD13A3, NDVI scaled by 0.0001. NASA LP DAAC open data."
        url: "https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MOD13A3"
      - id: "boundaries"
        name: "India administrative boundaries (districts, 2011-census demarcation)"
        role: "zonal aggregation units"
        description: "Community-maintained district GeoJSON, generalised for web use; 724 districts, 36 states/UTs. Not authoritative for legal boundary determination."
        url: "https://github.com/udit-001/india-maps-data"

# ---------------------------------------------------------------------------
# QA thresholds used by validate.py (mirrors and extends the app-side checks).
# ---------------------------------------------------------------------------
qa:
  completeness_warn: 90.0        # % of district-months below this -> warning
  completeness_fail: 70.0
  spi_abs_mean_warn: 0.25        # national area-weighted mean of SPI-6
  spi_sd_range: [0.70, 1.40]
  value_limits:
    zscore: [-4.0, 4.0]
    # Percent-of-mean anomaly: the mathematical floor is -100, but there is no
    # finite ceiling (a month can be >2x the climatological mean, especially in
    # dry seasons). Values above +200% are treated as suspect.
    sma_pct: [-100.0, 200.0]
    vci_pct: [0.0, 100.0]
