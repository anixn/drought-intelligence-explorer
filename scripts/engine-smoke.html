<!DOCTYPE html>
<!-- DEV ONLY — engine smoke test for tasks M1.6 + M5.3 verification.
     Not part of any shipped surface; lives in scripts/ alongside build tools.
     Serve the repo root with server.py, then open /scripts/engine-smoke.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIE engine smoke (dev)</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; margin: 2rem; background: #101418; color: #d8e0e8; }
  h1 { font-size: 16px; }
  .ok { color: #7dd487; } .bad { color: #ff8f8f; } .dim { color: #8a97a5; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>DIE engine smoke test (dev only — M1.6 + M5.3 gates)</h1>
<pre id="out">starting…</pre>
<script src="../assets/js/ducklab.js?v=2"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const lines = [];
  const say = (cls, s) => { lines.push('<span class="' + cls + '">' + s + '</span>'); out.innerHTML = lines.join('\n'); };

  (async () => {
    try {
      const t0 = performance.now();
      await DIE.Engine.ensureEngine();
      await DIE.Engine.ensureCatalog();
      const initMs = Math.round(performance.now() - t0);
      say(initMs < 8000 ? 'ok' : 'bad', 'GATE init < 8000 ms          -> ' + initMs + ' ms  ' + (initMs < 8000 ? 'PASS' : 'FAIL'));

      // cold district slice
      const d = 'gujarat-ahmedabad';
      const t1 = performance.now();
      const rows = await DIE.Engine.slice({ variable: 'spi_03', district: d });
      const coldMs = Math.round(performance.now() - t1);
      const coldBytes = DIE.Engine.bytes();
      say(coldMs < 100 ? 'ok' : 'bad', 'GATE cold slice < 100 ms     -> ' + coldMs + ' ms  ' + (coldMs < 100 ? 'PASS' : 'FAIL'));
      say('dim', '        rows=' + rows.length + ' first=' + JSON.stringify(rows[0]) + ' last=' + JSON.stringify(rows[rows.length - 1]));
      say('dim', '        cumulative bytes so far=' + coldBytes.bytes + ' requests=' + coldBytes.requests);

      // repeat slice must be 0 KB (byte interceptor + file cache)
      const b0 = DIE.Engine.bytes().bytes;
      await DIE.Engine.slice({ variable: 'spi_03', district: d });
      const repeatDelta = DIE.Engine.bytes().bytes - b0;
      say(repeatDelta === 0 ? 'ok' : 'bad', 'GATE repeat slice = 0 KB     -> ' + repeatDelta + ' bytes  ' + (repeatDelta === 0 ? 'PASS' : 'FAIL'));

      // a second district (new file range, still same cached file bytes)
      const r2 = await DIE.Engine.slice({ variable: 'vci', district: d, yearRange: [2010, 2020] });
      say('dim', 'vci 2010-2020 rows=' + r2.length + ' first=' + JSON.stringify(r2[0]));

      // mapMonth sanity
      const mm = await DIE.Engine.mapMonth({ variable: 'spi_03', date: '2002-07' });
      const present = mm.filter(x => x.value !== null && x.value !== undefined).length;
      say('dim', 'mapMonth 2002-07 rows=' + mm.length + ' present=' + present);

      // guard checks (must reject cleanly, not hang)
      try { await DIE.Engine.slice({ variable: 'spi_03', district: "x' OR 1=1--" }); say('bad', 'GUARD FAIL: injection accepted'); }
      catch (e) { say('ok', 'GUARD injection rejected -> ' + e.kind); }

      // ---- era C (real store, tasks M5.3+ gates) --------------------------
      // The ensemble district slice: 3 stats is what the band chart runs.
      const t2 = performance.now();
      const [med, p25, p75] = await Promise.all([
        DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'median', district: d, yearRange: [2026, 2040] }),
        DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'p25', district: d, yearRange: [2026, 2040] }),
        DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'p75', district: d, yearRange: [2026, 2040] }),
      ]);
      const ensColdMs = Math.round(performance.now() - t2);
      say(ensColdMs < 150 ? 'ok' : 'bad', 'GATE era-C band slice < 150 ms -> ' + ensColdMs + ' ms  ' + (ensColdMs < 150 ? 'PASS' : 'FAIL'));
      say('dim', '        median rows=' + med.length + ' first=' + JSON.stringify(med[0]) + ' last=' + JSON.stringify(med[med.length - 1]));
      // band sanity on a mid-window month: p25 <= median <= p75
      const medMap = new Map(med.map(r => [r.year * 100 + r.month, r.value]));
      const p25Map = new Map(p25.map(r => [r.year * 100 + r.month, r.value]));
      const p75Map = new Map(p75.map(r => [r.year * 100 + r.month, r.value]));
      let bandOk = true, bandChecked = 0;
      for (const [k, mv] of medMap) {
        const lo = p25Map.get(k), hi = p75Map.get(k);
        if (mv === null || mv === undefined) continue;
        if (lo == null || hi == null) continue;
        bandChecked++;
        if (!(lo <= mv && mv <= hi)) { bandOk = false; break; }
      }
      say(bandOk ? 'ok' : 'bad', 'CHECK p25 <= median <= p75 (n=' + bandChecked + ' months) -> ' + (bandOk ? 'PASS' : 'FAIL'));

      // map frame: one stat, one year, all 724 districts
      const t3 = performance.now();
      const frame = await DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'agreement_moderate', yearRange: [2040, 2040] });
      const frameMs = Math.round(performance.now() - t3);
      const districts = new Set(frame.map(r => r.district_id));
      const vals = frame.map(r => r.value).filter(v => v !== null && v !== undefined);
      const inRange = vals.every(v => v >= 0 && v <= 1);
      say('ok', 'INFO map frame 2040 -> ' + frameMs + ' ms, districts=' + districts.size + ', values=' + vals.length + ', all in [0,1]=' + inRange);
      say(frameMs < 500 ? 'ok' : 'bad', 'GATE era-C map frame < 500 ms -> ' + frameMs + ' ms  ' + (frameMs < 500 ? 'PASS' : 'FAIL'));

      // bad-stat guard (per-stat partitions whitelist)
      try { await DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'nonsense', district: d }); say('bad', 'GUARD FAIL: bad stat accepted'); }
      catch (e) { say('ok', 'GUARD bad stat rejected -> ' + e.kind); }
      // no-district call must now succeed (district is OPTIONAL since M5.3)
      const nat = await DIE.Engine.ensemble({ scenario: 'ssp245', variable: 'spi_03', stat: 'median', yearRange: [2040, 2040] });
      say(nat.length ? 'ok' : 'bad', 'CHECK ensemble without district rows=' + nat.length + ' (724 x 12 = 8688 expected)');

      const fin = DIE.Engine.bytes();
      say('dim', 'FINAL bytes=' + fin.bytes + ' requests=' + fin.requests + ' lastMs=' + Math.round(fin.lastMs));
      say('ok', 'SMOKE DONE — no uncaught errors');
    } catch (err) {
      say('bad', 'SMOKE ERROR: ' + (err && err.message || err));
      if (console && console.error) console.error(err);
    }
  })();
})();
</script>
</body>
</html>
