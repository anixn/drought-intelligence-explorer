# DIE v2.0 — gcm-pipeline paths.yaml
#
# Task M2.3 companion config (docs/v2/03 §3.1). All roots listed here are
# OWNER-LOCAL storage — nothing under raw/work/out is ever committed or
# shipped (docs/v2/03 §3.1; .gitignore covers gcm-pipeline/work/* and out/*).
#
# REALITY NOTE (2026-11-15): the spec sketch used work/raw/<model>/<exp>/<var>.nc,
# but the Owner's completed phase-1 download (download.R, 2,312 files) lives in
# a flat per-variable layout:
#
#   <raw_root>/<variable>/<var>_day_<model>_<experiment>_<variant>_<grid>_<year>_v2.0.nc
#
# Code is the source of truth: this layout is now the convention ALL gcm-pipeline
# scripts parse (00 download, 01 inventory, 02 regrid, ...). New downloads
# (phase 2 SSPs) must follow the SAME naming so the pipeline stays uniform.

raw_root: "D:/Websites/die-data/cmip6/outdir"   # phase-1 store, already populated (2312 historical files)
# Phase-2 SSP downloads (Owner-run, D:/die-download/download_cmip6.R):
# 8-model committed subset, ssp245+ssp585 2015-2100, same per-variable flat
# layout + naming. 00/01 will be extended to MERGE raw_root + raw_root_ssp
# in ssp mode (historical stays sourced from raw_root); the key is
# registered now so the download location is documented before the files
# arrive (provisional).
raw_root_ssp: "D:/die-download/data_raw/cmip6"
work_root: "work"    # relative to gcm-pipeline/ — manifests, plans, intermediates; NEVER shipped
out_root: "out"      # validated era-C products; only these ever reach data/parquet/projections/
