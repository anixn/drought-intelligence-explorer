    - "RESOLVED 2026-11-15: variant/grid_label template defaults replaced with on-disk reality (01_inventory_check.py over 2312 filenames): CESM2 pr=r4i1p1f1; CNRM-CM6-1 r1i1p1f2/gr; EC-Earth3 + EC-Earth3-Veg-LR gr; FGOALS-g3 r3i1p1f1; GFDL-ESM4 gr1; GISS-E2-1-G r1i1p1f2; HadGEM3-GC31-MM r1i1p1f3; INM-CM4-8/INM-CM5-0 gr1; IPSL-CM6A-LR gr; MIROC-ES2L r1i1p1f2. SSP phase-2 must use the same variant/grid per model."
