    - "CESM2 + IITM-ESM have pr ONLY (daily tasmax/tasmin absent per Owner report 2026-11-14) -> EXCLUDED from the era C ensemble (Owner decision 2026-11-14); ensemble stats computed over n=22, shown honestly"
