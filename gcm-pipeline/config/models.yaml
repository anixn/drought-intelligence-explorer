#   - table_id day (daily); variables: pr, tasmax, tasmin
#   - one documented variant per model (default r1i1p1f1); record grid_label
#   - historical coverage >= 1981 (calibration 1981-2020 uses model
#     historical 1981-2014 combined with ssp 2015-2020 — AS6)
#   - future coverage to 2100
#
# DOWNLOAD POLICY (PROGRESS.md §8, session-2 additions — ranking-before-SSP):
#   Phase 1 (now):   historical only, 1981-2014, all listed models.
#   Phase 2 (later): ssp245 + ssp585 2015-2100 ONLY for the best subset
#                    (8-12 models) selected by 08_validate_gcm.py.
#   Ensemble statistics are computed over the best subset; n is shown honestly
#   (never labelled "24 models").

