# DIE v2.0 - gcm-pipeline step 07 ensemble parameters (task M2.10).
#
# Exact definitions fixed per docs/v2/03 section 3.7 and printed VERBATIM
# into the output manifest; the UI must render them as tooltips (docs/v2/04
# section 4.2). Never show a single model; never hide disagreement behind a
# mean (C5). n is the count of AVAILABLE models per district-month - never
# assumed 24 (honest-ensemble X3: the historical-corrected product carries
# n = 22; SSP products are subset-gated by 08 -> best_subset.yaml).

ensemble:
  # quantile method (numpy): linear interpolation between order statistics
  quantile_method: "linear"
  # agreement thresholds on the standardised index scale
  agreement_moderate_threshold: -1.0    # fraction of models <= -1.0 (moderate)
  agreement_severe_threshold: -1.5      # fraction of models <= -1.5 (severe)
  # direction-of-change agreement (per window; ssp mode only):
  dir_agreement_window: [2081, 2100]    # future window mean
  dir_agreement_base: [1981, 2014]      # vs base-period mean (per model's own
                                        # base record). CHANGED 2026-11-18 from
                                        # [1981, 2020] per register D6: the base
                                        # is the GCM-native historical window -
                                        # ssp-segment years 2015-2020 are
                                        # projections and never sit inside a
                                        # model baseline. Landed BEFORE the
                                        # pending step-07/09 re-run, so the
                                        # Owner's next run picks it up.
  # The configured window is a NOMINAL target. The effective window follows a
  # declared two-step rule (printed verbatim into the NC attrs, the ensemble
  # manifest and the export manifest, and stated in the UI):
  #   1. the overlap of dir_agreement_window with the years present in the
  #      record, when that overlap holds at least dir_agreement_min_window_years
  #      distinct years. Since 2026-11-19 the SSP record runs to 2100, so the
  #      effective window IS 2081-2100;
  #   2. otherwise the LATEST dir_agreement_min_window_years years available
  #      (2041-2050 while the record ended 2050) - an explicit, labelled
  #      record-end truncation, never a silent shortening and never a stub.
  # If the record itself holds fewer than the minimum years, the statistic is
  # NOT emitted (honest null).
  dir_agreement_min_window_years: 10
  # dir_agreement_drier = fraction of models whose window mean is drier
  # (lower z) than their base mean. Not applicable in historical-corrected
  # mode (no future window) - recorded as null in that manifest.
  # dir_agreement_n = number of models with BOTH a finite base mean and a
  # finite window mean (the exact denominator; printed in the UI tooltip).
