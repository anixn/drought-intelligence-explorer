# DIE v2.0 - CI (owner amendment O14, scheduled at task M1.9)
#
# Green CI is required before merge to v2-dev. This protects the
# "frozen semantics" promise:
#   1. data-pipeline/selftest.py      - 82 assertions, seed-deterministic
#   2. scripts/regression_check.py    - shipped-data regression baseline
# Later tasks extend this file with selftest_gcm.py (M2.14) and
# selftest_atlas.py (M6) - run them alongside, never instead.
#
# Note: the local Windows dev flow needs PROJ_LIB/GDAL_DATA overrides because
# PostGIS sets global env vars; the rasterio manylinux wheels used here bundle
# their own PROJ/GDAL data, so no overrides are needed on CI.

name: CI

on:
  push:
    branches: [v2-dev, master]
  pull_request:
    branches: [v2-dev, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt
          pip install pyarrow

      - name: Pipeline selftest (82 assertions)
        working-directory: data-pipeline
        run: python selftest.py

      - name: Regression harness (shipped-data baseline)
        run: python scripts/regression_check.py
